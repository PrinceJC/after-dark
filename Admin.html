<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --ink:#0f2a44; --night:#14385e; --lime:#9fd136; --teal:#2aa9b4; --cyan:#74e0ea; --yellow:#ffd84a; --paper:#f6fbef; --muted:#4a627a; --danger:#b4232a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; color:var(--ink); background:var(--paper); font-size:15px; }
  header { background:var(--night); color:#fff; padding:14px 20px; display:flex; flex-wrap:wrap; gap:8px 20px; align-items:center; justify-content:space-between; border-bottom:4px solid var(--lime); }
  header h1 { margin:0; font-size:20px; }
  header .who { font-size:13px; color:#cfe8f2; }
  main { max-width:1280px; margin:0 auto; padding:18px 20px 40px; }
  .counts { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .count { background:#fff; border:2px solid var(--ink); border-radius:10px; padding:8px 14px; min-width:120px; }
  .count b { display:block; font-size:22px; }
  .count span { font-size:12px; color:var(--muted); }
  .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px; }
  input[type=search], select, textarea { font:inherit; border:2px solid var(--ink); border-radius:8px; padding:8px 10px; background:#fff; color:var(--ink); }
  input[type=search] { flex:1 1 280px; min-width:200px; }
  button, .btn { font:inherit; font-weight:600; border:2px solid var(--ink); border-radius:8px; padding:8px 14px; background:#fff; color:var(--ink); cursor:pointer; text-decoration:none; display:inline-block; }
  button.primary { background:var(--lime); }
  button:disabled { opacity:.55; cursor:progress; }
  button:hover:not(:disabled), .btn:hover { background:var(--yellow); }
  :focus-visible { outline:3px solid var(--teal); outline-offset:2px; }
  .tablewrap { overflow-x:auto; background:#fff; border:2px solid var(--ink); border-radius:12px; }
  table { border-collapse:collapse; width:100%; min-width:860px; }
  th, td { text-align:left; padding:9px 12px; border-bottom:1px solid #dbe5ec; vertical-align:top; }
  th { background:#eef6f8; font-size:13px; position:sticky; top:0; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:#f4fbe8; }
  tbody tr.sel { background:#e7f7fa; }
  .ref { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight:700; white-space:nowrap; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; border:1.5px solid var(--ink); font-size:12.5px; font-weight:700; white-space:nowrap; }
  .s-Received { background:#e6f2ff; }
  .s-Under-review { background:#fff3c4; }
  .s-Accepted { background:#ddf3b8; }
  .s-Needs-clarification { background:#ffe0cc; }
  .s-Upload-pending { background:#eee; color:#555; border-color:#999; }
  .s-Upload-rejected { background:#fde2e2; color:var(--danger); border-color:var(--danger); }
  .empty { padding:30px; text-align:center; color:var(--muted); }
  .msg { padding:10px 14px; border-radius:8px; margin-bottom:12px; border:2px solid; }
  .msg.err { border-color:var(--danger); background:#fdecec; }
  .msg.ok { border-color:#5f9a1a; background:#eaf8d6; }
  /* detail drawer */
  .drawer { position:fixed; inset:0 0 0 auto; width:min(560px,100%); background:#fff; border-left:4px solid var(--ink); box-shadow:-8px 0 0 rgba(15,42,68,.08); overflow-y:auto; padding:18px 20px 30px; transform:translateX(105%); transition:transform .2s ease; z-index:5; }
  .drawer.open { transform:none; }
  .drawer h2 { margin:0 0 4px; font-size:20px; }
  .drawer dl { display:grid; grid-template-columns:150px 1fr; gap:6px 12px; margin:14px 0; }
  .drawer dt { color:var(--muted); font-size:13px; }
  .drawer dd { margin:0; white-space:pre-wrap; word-break:break-word; }
  .video { background:#0f2a44; border-radius:10px; overflow:hidden; aspect-ratio:9/16; max-height:62vh; margin:10px auto; display:grid; place-items:center; color:#fff; }
  .video iframe { width:100%; height:100%; border:0; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
  .note { font-size:12.5px; color:var(--muted); }
  label.lbl { display:block; font-weight:700; margin:12px 0 4px; }
  textarea { width:100%; min-height:90px; }
  .closebtn { float:right; }
  .danger-zone { margin-top:26px; padding-top:16px; border-top:2px dashed #e3b4b4; }
  button.danger { background:#fff; color:var(--danger); border-color:var(--danger); }
  button.danger:hover:not(:disabled) { background:#fdecec; }
  button.danger-solid { background:var(--danger); color:#fff; border-color:var(--danger); }
  button.danger-solid:hover:not(:disabled) { background:#8f1b21; }
  .confirm-box { border:2px solid var(--danger); background:#fdecec; border-radius:10px; padding:12px 14px; margin-top:10px; }
  @media (max-width:600px){ .drawer dl{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>HighCall After Dark — Submissions</h1>
  <div class="who">Signed in as <?= adminEmail ?></div>
</header>
<main>
  <div id="msg"></div>
  <div class="counts" id="counts"></div>
  <div class="toolbar">
    <input type="search" id="q" placeholder="Search name, email, reference, title, character…" aria-label="Search submissions">
    <select id="filter" aria-label="Filter by status">
      <option value="complete">All completed entries</option>
      <option value="Received">Received</option>
      <option value="Under review">Under review</option>
      <option value="Accepted">Accepted</option>
      <option value="Needs clarification">Needs clarification</option>
      <option value="incomplete">Incomplete or rejected uploads</option>
      <option value="all">Everything</option>
    </select>
    <button id="refresh">Refresh</button>
    <button id="csv" class="primary">Download CSV</button>
    <button id="csvDrive">Save CSV to Drive</button>
    <label class="note"><input type="checkbox" id="csvAll"> include incomplete</label>
  </div>
  <p class="note" id="updated"></p>
  <div class="tablewrap">
    <table>
      <thead><tr><th>Reference</th><th>Status</th><th>Full name</th><th>Email</th><th>Entry title</th><th>Character</th><th>Video received (PHT)</th></tr></thead>
      <tbody id="rows"><tr><td colspan="7" class="empty">Loading submissions…</td></tr></tbody>
    </table>
  </div>
</main>

<aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="d-title">
  <button class="closebtn" id="close">Close</button>
  <h2 id="d-title"></h2>
  <div id="d-body"></div>
</aside>

<script>
var COMPLETE = ['Received','Under review','Accepted','Needs clarification'];
var data = [], statuses = [], current = null;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pill(s){ return '<span class="pill s-' + esc(String(s).replace(/\s+/g,'-')) + '">' + esc(s) + '</span>'; }
function flash(text, ok){ $('msg').innerHTML = '<div class="msg ' + (ok ? 'ok' : 'err') + '">' + text + '</div>'; if (ok) setTimeout(function(){ $('msg').innerHTML=''; }, 4000); }
function fail(e){ flash(esc((e && e.message) || e || 'Something went wrong.'), false); }
function idOk(id){ return /^[A-Za-z0-9_-]{10,200}$/.test(id || ''); }

function load(){
  $('refresh').disabled = true;
  google.script.run.withSuccessHandler(function(res){
    data = res.records; statuses = res.statuses;
    $('updated').textContent = 'Last updated ' + res.generatedAt;
    $('refresh').disabled = false;
    renderCounts(); render();
    if (current) { var r = find(current.reference); if (r) openDetail(r); }
  }).withFailureHandler(function(e){ $('refresh').disabled = false; fail(e); }).listSubmissions();
}
function find(ref){ for (var i=0;i<data.length;i++) if (data[i].reference === ref) return data[i]; return null; }

function renderCounts(){
  var c = { total:0 }; COMPLETE.forEach(function(s){ c[s]=0; }); var inc = 0;
  data.forEach(function(r){ if (COMPLETE.indexOf(r.status) !== -1){ c.total++; c[r.status]++; } else inc++; });
  var html = '<div class="count"><b>' + c.total + '</b><span>Completed entries</span></div>';
  COMPLETE.forEach(function(s){ html += '<div class="count"><b>' + c[s] + '</b><span>' + esc(s) + '</span></div>'; });
  html += '<div class="count"><b>' + inc + '</b><span>Incomplete or rejected</span></div>';
  $('counts').innerHTML = html;
}

function matches(r){
  var f = $('filter').value;
  if (f === 'complete' && COMPLETE.indexOf(r.status) === -1) return false;
  if (f === 'incomplete' && COMPLETE.indexOf(r.status) !== -1) return false;
  if (['complete','incomplete','all'].indexOf(f) === -1 && r.status !== f) return false;
  var q = $('q').value.trim().toLowerCase();
  if (!q) return true;
  return [r.reference, r.fullName, r.email, r.entryTitle, r.character, r.description, r.fileName].join(' ').toLowerCase().indexOf(q) !== -1;
}

function render(){
  var rows = data.filter(matches);
  if (!rows.length) { $('rows').innerHTML = '<tr><td colspan="7" class="empty">' + (data.length ? 'No submissions match this search.' : 'No submissions yet.') + '</td></tr>'; return; }
  $('rows').innerHTML = rows.map(function(r){
    return '<tr tabindex="0" data-ref="' + esc(r.reference) + '"' + (current && current.reference === r.reference ? ' class="sel"' : '') + '>' +
      '<td class="ref">' + esc(r.reference) + '</td><td>' + pill(r.status) + '</td><td>' + esc(r.fullName) + '</td><td>' + esc(r.email) + '</td>' +
      '<td>' + esc(r.entryTitle) + '</td><td>' + esc(r.character) + '</td><td>' + esc(r.receivedAt || '—') + '</td></tr>';
  }).join('');
}

$('rows').addEventListener('click', function(e){ var tr = e.target.closest('tr[data-ref]'); if (tr) openDetail(find(tr.getAttribute('data-ref'))); });
$('rows').addEventListener('keydown', function(e){ if (e.key === 'Enter'){ var tr = e.target.closest('tr[data-ref]'); if (tr) openDetail(find(tr.getAttribute('data-ref'))); } });
$('q').addEventListener('input', render);
$('filter').addEventListener('change', render);
$('refresh').addEventListener('click', load);
$('close').addEventListener('click', closeDetail);
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeDetail(); });

function field(label, value){ return '<dt>' + esc(label) + '</dt><dd>' + (value ? esc(value) : '—') + '</dd>'; }

function openDetail(r){
  if (!r) return;
  current = r;
  render();
  $('d-title').textContent = r.entryTitle || r.reference;
  var complete = COMPLETE.indexOf(r.status) !== -1;
  var id = r.driveFileId;
  var html = '<div>' + pill(r.status) + ' <span class="ref">' + esc(r.reference) + '</span></div>';
  if (idOk(id)) {
    html += '<div class="video" id="video"><button id="loadVideo">Preview video</button></div>' +
      '<div class="row"><a class="btn" target="_blank" rel="noopener" href="https://drive.google.com/file/d/' + encodeURIComponent(id) + '/view">Open in Drive</a>' +
      '<a class="btn" target="_blank" rel="noopener" href="https://drive.google.com/uc?export=download&id=' + encodeURIComponent(id) + '">Download</a></div>' +
      '<p class="note">Preview and download use your own Google Drive access. If the video doesn’t load, ask the administrator to add you to the contest folder.</p>';
  }
  html += '<dl>' +
    field('Full name', r.fullName) + field('Email', r.email) + field('Entry title', r.entryTitle) + field('Character', r.character) +
    field('Description', r.description) + field('Registered', r.registeredAt) + field('Video received', r.receivedAt) +
    field('Finished in grace period', r.graceUsed) + field('File', r.fileName ? r.fileName + (r.fileSizeMB ? ' (' + r.fileSizeMB + ' MB)' : '') : '') +
    field('Status updated', r.statusUpdatedBy ? r.statusUpdatedBy + ', ' + r.statusUpdatedAt : '') + '</dl>';

  if (complete) {
    html += '<label class="lbl" for="d-status">Review status</label><select id="d-status">' +
      statuses.map(function(s){ return '<option' + (s === r.status ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('') + '</select>';
  } else {
    html += '<p class="note">This upload is incomplete or was rejected by the automatic checks, so it can’t be reviewed. It isn’t counted as an entry.</p>';
  }
  html += '<label class="lbl" for="d-notes">Admin notes (staff only)</label><textarea id="d-notes" maxlength="5000">' + esc(r.adminNotes) + '</textarea>' +
    '<div class="row"><button class="primary" id="d-save">Save changes</button></div>' +
    '<div class="danger-zone"><button class="danger" id="d-del">Delete entry</button>' +
    '<div class="confirm-box" id="d-confirm" hidden><p style="margin-top:0"><strong>Delete ' + esc(r.reference) + ' permanently?</strong> ' +
    'The entry is removed from the list and the Sheet, and its video moves to Drive trash, where it can be restored for 30 days.</p>' +
    '<div class="row" style="margin-bottom:0"><button class="danger-solid" id="d-del-yes">Yes, delete</button><button id="d-del-no">Cancel</button></div></div></div>';
  $('d-body').innerHTML = html;
  $('drawer').classList.add('open');
  $('drawer').setAttribute('aria-hidden', 'false');

  if ($('loadVideo')) $('loadVideo').addEventListener('click', function(){
    $('video').innerHTML = '<iframe src="https://drive.google.com/file/d/' + encodeURIComponent(id) + '/preview" allow="autoplay; fullscreen" allowfullscreen title="Video preview"></iframe>';
  });
  $('d-del').addEventListener('click', function(){ $('d-confirm').hidden = false; this.hidden = true; $('d-del-yes').focus(); });
  $('d-del-no').addEventListener('click', function(){ $('d-confirm').hidden = true; $('d-del').hidden = false; });
  $('d-del-yes').addEventListener('click', function(){
    var btn = this; btn.disabled = true; btn.textContent = 'Deleting…'; $('d-del-no').disabled = true;
    google.script.run.withSuccessHandler(function(res){
      data = data.filter(function(x){ return x.reference !== res.reference; });
      closeDetail(); renderCounts();
      flash('Deleted ' + esc(res.reference) + '.' + (res.videoTrashed ? ' Its video is in Drive trash for 30 days if you need to restore it.' : (res.hadVideo ? ' The video couldn’t be moved to trash; remove it from the Drive folder manually.' : '')), true);
    }).withFailureHandler(function(e){ btn.disabled = false; btn.textContent = 'Yes, delete'; $('d-del-no').disabled = false; fail(e); }).deleteEntry(r.reference);
  });
  $('d-save').addEventListener('click', function(){
    var btn = this; btn.disabled = true; btn.textContent = 'Saving…';
    var changes = { adminNotes: $('d-notes').value };
    if ($('d-status')) changes.status = $('d-status').value;
    google.script.run.withSuccessHandler(function(updated){
      for (var i=0;i<data.length;i++) if (data[i].reference === updated.reference) data[i] = updated;
      renderCounts(); openDetail(updated);
      flash('Saved ' + esc(updated.reference) + '.', true);
    }).withFailureHandler(function(e){ btn.disabled = false; btn.textContent = 'Save changes'; fail(e); }).updateEntry(r.reference, changes);
  });
}

function closeDetail(){
  current = null;
  $('drawer').classList.remove('open');
  $('drawer').setAttribute('aria-hidden', 'true');
  $('d-body').innerHTML = ''; // stops any playing preview
  render();
}

$('csv').addEventListener('click', function(){
  var btn = this; btn.disabled = true;
  google.script.run.withSuccessHandler(function(res){
    btn.disabled = false;
    try {
      var blob = new Blob([res.csv], { type: 'text/csv;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = res.filename;
      document.body.appendChild(a); a.click(); a.remove();
      flash('Exported ' + res.count + ' rows. If no download started, use “Save CSV to Drive”.', true);
    } catch (e) { fail('Your browser blocked the download. Use “Save CSV to Drive” instead.'); }
  }).withFailureHandler(function(e){ btn.disabled = false; fail(e); }).exportCsv($('csvAll').checked);
});

$('csvDrive').addEventListener('click', function(){
  var btn = this; btn.disabled = true;
  google.script.run.withSuccessHandler(function(res){
    btn.disabled = false;
    flash('Saved ' + res.count + ' rows to <a target="_blank" rel="noopener" href="' + esc(res.url) + '">' + esc(res.name) + '</a> (next to the submissions sheet).', true);
  }).withFailureHandler(function(e){ btn.disabled = false; fail(e); }).saveCsvToDrive($('csvAll').checked);
});

load();
</script>
</body>
</html>
